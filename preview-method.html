<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Method Preview</title>
<style>
  :root {
    --ink: #1d1d1f;
    --ink-2: #6e6e73;
    --ink-3: #86868b;
    --surface: #f5f5f7;
    --hairline: rgba(0,0,0,0.08);
    --blue: #0071e3;
    --blue-hover: #0077ed;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
    background: rgba(0,0,0,0.4);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    -webkit-font-smoothing: antialiased;
  }
  .modal {
    background: white;
    border-radius: 36px;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
    border: 1px solid var(--hairline);
    width: 100%;
    max-width: 448px;
    padding: 16px;
    display: flex;
    flex-direction: column;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 4px 4px 8px;
  }
  .close-btn {
    display: inline-flex;
    height: 36px;
    width: 36px;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: var(--surface);
    border: none;
    cursor: pointer;
    color: var(--ink);
  }
  .close-btn:hover { background: var(--hairline); }
  .body { padding: 12px 4px; }
  .title {
    text-align: center;
    margin-bottom: 24px;
  }
  .title h3 {
    font-size: 20px;
    font-weight: 700;
    color: var(--ink);
  }
  .title p {
    font-size: 13px;
    color: var(--ink-3);
    margin-top: 4px;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .method-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    border-radius: 16px;
    border: 1px solid var(--hairline);
    background: var(--surface);
    padding: 20px;
    cursor: pointer;
    transition: border-color 0.15s;
    font-family: inherit;
  }
  .method-btn:hover {
    border-color: var(--ink-3);
  }
  .method-btn .label {
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
  }
  .method-btn .sub {
    font-size: 12px;
    color: var(--ink-3);
  }
  .back-btn {
    display: block;
    width: 100%;
    text-align: center;
    font-size: 13px;
    color: var(--ink-3);
    margin-top: 20px;
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
  }
  .back-btn:hover { color: var(--ink); }
</style>
</head>
<body>
  <div class="modal">
    <div class="header">
      <button class="close-btn">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M11.9997 10.5865L16.9495 5.63672L18.3637 7.05093L13.4139 12.0007L18.3637 16.9504L16.9495 18.3646L11.9997 13.4149L7.04996 18.3646L5.63574 16.9504L10.5855 12.0007L5.63574 7.05093L7.04996 5.63672L11.9997 10.5865Z"></path></svg>
      </button>
    </div>
    <div class="body">
      <div class="title">
        <h3>How would you like to pay?</h3>
        <p>Choose your preferred payment method</p>
      </div>
      <div class="grid">
        <button class="method-btn">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" />
            <path d="M9.5 8h4a1.5 1.5 0 0 1 0 3H9.5v5h4a1.5 1.5 0 0 0 0-3H9.5" />
            <path d="M12 6v2m0 8v2" />
          </svg>
          <span class="label">Crypto</span>
          <span class="sub">USDC, USDT, DAI</span>
        </button>
        <button class="method-btn">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="5" width="20" height="14" rx="2" />
            <line x1="2" y1="10" x2="22" y2="10" />
          </svg>
          <span class="label">Card</span>
          <span class="sub">Visa, Mastercard</span>
        </button>
      </div>
      <button class="back-btn">Back</button>
    </div>
  </div>
</body>
</html>
