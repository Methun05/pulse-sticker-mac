<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PulseSticker — Hero Prototype</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --background: #ffffff; --surface: #f5f5f7; --ink: #1d1d1f;
    --ink-2: #56565c; --ink-3: #86868b; --hairline: #d2d2d7;
    --blue: #0071e3;
    --font: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', system-ui, sans-serif;
  }
  html { scroll-behavior: smooth; background: var(--background); }
  body { font-family: var(--font); color: var(--ink); background: var(--background); -webkit-font-smoothing: antialiased; min-height: 100vh; }
  ::selection { background: var(--blue); color: #fff; }

  /* ═══ NAVBAR ═══ */
  .nav { position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,0.8); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); }
  .nav-container { max-width: 80rem; margin: 0 auto; width: 100%; padding: 0 16px; }
  @media (min-width: 640px) { .nav-container { padding: 0 24px; } }
  @media (min-width: 1024px) { .nav-container { padding: 0 32px; } }
  .nav-inner { position: relative; display: flex; align-items: center; justify-content: space-between; height: 56px; }
  .nav-logo { text-decoration: none; font-size: 20px; font-weight: 600; color: var(--ink); transition: opacity 0.15s; }
  .nav-logo:hover { opacity: 0.8; }
  .nav-center { display: none; position: absolute; left: 50%; transform: translateX(-50%); height: 100%; align-items: center; gap: 4px; }
  @media (min-width: 768px) { .nav-center { display: flex; } }
  .nav-center button { display: flex; align-items: center; padding: 0 12px; height: 100%; background: none; border: none; cursor: pointer; font-family: var(--font); font-weight: 600; font-size: 16px; color: var(--ink-2); transition: all 0.3s; }
  .nav-center button:hover { color: var(--ink); transform: scale(1.03); }
  .nav-right { display: flex; align-items: center; gap: 6px; }
  .nav-btn { display: inline-flex; align-items: center; justify-content: center; border-radius: 14px; font-family: var(--font); font-size: 16px; font-weight: 600; height: 40px; padding: 8px 16px; cursor: pointer; transition: all 0.3s; outline: none; }
  .nav-btn:hover { transform: scale(1.04); }
  .nav-btn:active { transform: scale(0.92); }
  @media (max-width: 767px) { .nav-btn { padding: 8px 12px; font-size: 14px; } }
  .nav-btn--outline { display: none; border: 1px solid var(--hairline); background: #fff; color: var(--ink); }
  .nav-btn--outline:hover { background: rgba(29,29,31,0.05); }
  @media (min-width: 768px) { .nav-btn--outline { display: inline-flex; } }
  .nav-btn--primary { border: none; background: var(--ink); color: #fff; }
  .nav-btn--primary:hover { opacity: 0.9; }
  .nav-hamburger { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 9999px; border: 1px solid var(--hairline); background: #fff; color: var(--ink); cursor: pointer; }
  @media (min-width: 768px) { .nav-hamburger { display: none; } }
  .nav-mobile-menu { display: none; background: #fff; padding: 12px 16px; }
  .nav-mobile-menu.open { display: block; }
  @media (min-width: 768px) { .nav-mobile-menu { display: none !important; } }
  .nav-mobile-menu button { display: block; background: none; border: none; cursor: pointer; font-family: var(--font); font-size: 16px; font-weight: 600; color: var(--ink-2); padding: 0; margin-bottom: 12px; }

  /* ═══ HERO ═══ */
  .hero { position: relative; display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 48px 16px 48px; text-align: center; }
  @media (min-width: 640px) { .hero { padding-top: 56px; padding-bottom: 64px; } }
  .hero-inner { display: flex; width: 100%; flex-direction: column; align-items: center; gap: 16px; }
  .hero-content { display: flex; width: 100%; max-width: 64rem; flex-direction: column; align-items: center; }

  /* Outlined gradient number — matching reference */
  .hero-raised {
    position: relative;
    z-index: 2;
    font-size: 80px;
    font-weight: 900;
    letter-spacing: -0.02em;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    font-style: italic;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    filter: drop-shadow(3px 4px 6px rgba(20, 70, 40, 0.3));
  }
  @media (min-width: 640px) { .hero-raised { font-size: 100px; } }

  .hero-raised-wrap {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  /* Back layer: thick dark green stroke */
  .hero-raised-shadow {
    position: absolute;
    top: 0; left: 0;
    font: inherit;
    letter-spacing: inherit;
    line-height: inherit;
    font-variant-numeric: tabular-nums;
    color: #2d7a50;
    -webkit-text-stroke: 3px #2d7a50;
    paint-order: stroke fill;
    z-index: 0;
    pointer-events: none;
    user-select: none;
  }

  /* Front layer: mint-to-green gradient fill */
  .hero-raised-front {
    position: relative;
    z-index: 1;
    background: linear-gradient(180deg, #4db87a 0%, #8fe8b0 40%, #d4f7e2 75%, #f0fcf4 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .hero-progress { margin-top: 6px; max-width: 16rem; width: 100%; position: relative; z-index: 2; pointer-events: none; }
  .hero-progress-labels { display: flex; justify-content: space-between; font-size: 13px; }
  .hero-progress-labels .raised-label { color: var(--ink-2); }
  .hero-progress-labels .goal-label { color: var(--ink-3); }
  .hero-progress-bar { margin-top: 6px; height: 4px; border-radius: 9999px; background: var(--surface); overflow: hidden; }
  .hero-progress-fill { height: 100%; border-radius: 9999px; background: linear-gradient(to right, #00BFFF, #8B5CF6, #EC4899); width: 40%; }

  .hero-headline { margin-top: 24px; font-size: clamp(1.75rem, 5vw, 3rem); font-weight: 500; letter-spacing: -0.04em; line-height: 1.1; color: var(--ink); text-wrap: balance; }
  .hero-sub { margin-top: 12px; font-size: 15px; font-weight: 400; line-height: 1.6; color: var(--ink-2); max-width: 52ch; }
  @media (min-width: 640px) { .hero-sub { font-size: 17px; } }
  .hero-cta-wrap { margin-top: 24px; display: flex; align-items: center; justify-content: center; gap: 24px; flex-wrap: wrap; }
  .hero-secondary-link { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; color: var(--ink-3); text-decoration: none; transition: color 0.15s; }
  .hero-secondary-link:hover { color: var(--ink-2); }
  .hero-secondary-link .ubar { display: block; height: 1px; width: 100%; background: var(--ink-3); transform: scaleX(0); transform-origin: left; transition: transform 0.5s cubic-bezier(.16,1,.3,1); }
  .hero-secondary-link:hover .ubar { transform: scaleX(1); }

  /* Hero CTA — solid minimal button */
  .hero-cta {
    display: inline-flex; align-items: center; justify-content: center;
    height: 56px; padding: 0 32px; border: none; border-radius: 20px;
    background: var(--ink); color: #fff;
    font-family: var(--font); font-size: 18px; font-weight: 600;
    cursor: pointer; transition: all 0.3s;
  }
  .hero-cta:hover { transform: scale(1.05); }
  .hero-cta:active { transform: scale(0.9); }

  .rest-placeholder { height: 60vh; display: flex; align-items: center; justify-content: center; color: var(--ink-3); font-size: 14px; border-top: 1px solid var(--hairline); }
</style>
</head>
<body>

  <nav class="nav"><div class="nav-container"><div class="nav-inner">
    <a href="/" class="nav-logo">PulseSticker</a>
    <div class="nav-center"><button>Spots</button><button>How it works</button><button>FAQ</button></div>
    <div class="nav-right">
      <button class="nav-btn nav-btn--outline">Learn more</button>
      <button class="nav-btn nav-btn--primary">Claim your spot</button>
      <button class="nav-hamburger" aria-label="Menu" onclick="toggleMobile()">
        <svg id="menu-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M18 18V20H6V18H18ZM21 11V13H3V11H21ZM18 4V6H6V4H18Z"/></svg>
        <svg id="close-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" style="display:none"><path d="M2 2l12 12M14 2L2 14" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
    </div>
  </div></div>
  <div class="nav-mobile-menu" id="mobileMenu"><button>Spots</button><button>How it works</button><button>FAQ</button></div>
  </nav>

  <section class="hero"><div class="hero-inner"><div class="hero-content">
    <!-- 3D extruded raised number -->
    <div class="hero-raised-wrap hero-raised">
      <span class="hero-raised-shadow" id="raisedShadow">$0</span>
      <span class="hero-raised-front" id="raised">$0</span>
    </div>

    <div class="hero-progress">
      <div class="hero-progress-labels"><span class="raised-label">$200 raised</span><span class="goal-label">goal $500</span></div>
      <div class="hero-progress-bar"><div class="hero-progress-fill"></div></div>
    </div>

    <h1 class="hero-headline">Taking PulseChain to the World</h1>
    <p class="hero-sub">Promote your PulseChain project on my MacBook and support a community-driven mission to bring PulseChain into the real world.</p>
  </div>
  <div class="hero-cta-wrap">
    <button class="hero-cta">Claim a spot</button>
    <a href="/manifesto" class="hero-secondary-link"><span><span>Support the mission</span><span class="ubar"></span></span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </a>
  </div></div></section>

  <div class="rest-placeholder">↓ Rest of the page ↓</div>

<script>
  // CountUp — syncs both shadow and front layers
  !function(){
    var front = document.getElementById('raised');
    var shadow = document.getElementById('raisedShadow');
    var target = 200, dur = 1500, from = 180, t0 = performance.now();
    function tick(now) {
      var p = Math.min((now - t0) / dur, 1);
      var e = 1 - (1 - p) * (1 - p);
      var txt = '$' + Math.round(from + e * (target - from));
      front.textContent = txt;
      shadow.textContent = txt;
      if (p < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }();

  // Mobile menu
  function toggleMobile(){var m=document.getElementById('mobileMenu'),o=m.classList.toggle('open');document.getElementById('menu-icon').style.display=o?'none':'block';document.getElementById('close-icon').style.display=o?'block':'none'}
</script>
</body>
</html>
